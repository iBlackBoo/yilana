    <style>
        :root {
            --bg: #08080f;
            --bg2: #0d0d1a;
            --surface: #141428;
            --surface2: #1b1b34;
            --text: #e8e8f5;
            --accent1: #ff6b9d;
            --accent2: #4ecdc4;
            --accent3: #ffe66d;
            --accent4: #a37eba;
            --accent5: #6c8cff;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: radial-gradient(circle at 20% 0%, #16162e 0%, var(--bg) 55%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* 背景粒子画布 */
        #bgCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        /* 导航栏 */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(8, 8, 15, 0.75);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
        }
        .nav-inner {
            max-width: 1280px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between; height: 66px;
        }
        .logo {
            font-size: 1.25rem; font-weight: 700; color: var(--text); text-decoration: none;
            display: flex; align-items: center; gap: 0.5rem; letter-spacing: 0.04em;
        }
        .logo .icon {
            width: 34px; height: 34px; border-radius: 9px;
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
            box-shadow: 0 0 18px rgba(255, 107, 157, 0.5);
        }
        .logo-domain { font-size: 0.7rem; font-weight: 400; color: var(--accent2); letter-spacing: 0.06em; margin-left: 4px; }
        .nav-links { display: flex; gap: 0.5rem; align-items: center; list-style: none; }
        .nav-links a { text-decoration: none; color: #b0b0d0; padding: 0.45rem 1rem; border-radius: 20px; font-size: 0.9rem; transition: all 0.25s; }
        .nav-links a:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .nav-count { font-size: 0.78rem; color: var(--accent3); background: rgba(255,230,109,0.1); padding: 0.3rem 0.8rem; border-radius: 20px; border: 1px solid rgba(255,230,109,0.25); }

        /* 语言切换 */
        .nav-right { display: flex; align-items: center; gap: 0.8rem; }
        .lang-switch {
            background: rgba(108,140,255,0.12); color: var(--accent5);
            border: 1px solid rgba(108,140,255,0.35); border-radius: 20px;
            padding: 0.42rem 1rem; font-size: 0.85rem; font-weight: 700; font-family: inherit;
            letter-spacing: 0.04em; cursor: pointer; transition: all 0.25s; white-space: nowrap;
        }
        .lang-switch:hover { background: rgba(108,140,255,0.28); color: #fff; box-shadow: 0 0 18px rgba(108,140,255,0.4); }
        .lang-switch:active { transform: scale(0.96); }
        html[lang="en"] body,
        html[lang="en"] .effect-card h3 { letter-spacing: 0.01em; }
        html[lang="en"] .hero h1 { letter-spacing: 0.02em; }
        html[lang="en"] .effect-card p { line-height: 1.5; }

        /* 英雄区 */
        .hero {
            position: relative; z-index: 1;
            text-align: center; padding: 9rem 2rem 4rem;
        }
        .hero h1 {
            font-size: clamp(2.4rem, 6vw, 4.2rem); font-weight: 800; letter-spacing: 0.04em; margin-bottom: 1rem;
            background: linear-gradient(120deg, var(--accent3), var(--accent1), var(--accent2), var(--accent5));
            background-size: 300% 100%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: hue 8s linear infinite;
        }
        @keyframes hue { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
        .hero p { color: #9a9ac0; font-size: 1.1rem; max-width: 620px; margin: 0 auto 2rem; line-height: 1.8; }
        .hero-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent1), var(--accent4));
            color: #fff; border: none; padding: 0.8rem 2.2rem; border-radius: 30px; font-weight: 700; font-size: 1rem;
            cursor: pointer; box-shadow: 0 8px 28px rgba(255, 107, 157, 0.4); transition: all 0.25s;
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(255, 107, 157, 0.6); }
        .btn-ghost {
            background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border);
            padding: 0.8rem 2.2rem; border-radius: 30px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.25s;
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.12); }

        /* 过滤器 */
        .filters {
            position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 2rem;
            display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; align-items: center;
        }
        .filter-btn {
            background: var(--surface); color: #b0b0d0; border: 1px solid var(--border);
            padding: 0.5rem 1.3rem; border-radius: 24px; cursor: pointer; font-size: 0.9rem; transition: all 0.25s;
        }
        .filter-btn:hover { color: #fff; border-color: rgba(255,255,255,0.25); }
        .filter-btn.active { background: linear-gradient(135deg, var(--accent1), var(--accent4)); color: #fff; border-color: transparent; box-shadow: 0 4px 16px rgba(255,107,157,0.35); }
        .search-box {
            background: var(--surface); border: 1px solid var(--border); color: var(--text);
            padding: 0.5rem 1.1rem; border-radius: 24px; font-size: 0.9rem; outline: none; min-width: 200px;
        }
        .search-box::placeholder { color: #6a6a8a; }

        /* 区块 */
        .section { position: relative; z-index: 1; padding: 3.5rem 2rem 2rem; max-width: 1280px; margin: 0 auto; }
        .section-header { text-align: center; margin-bottom: 2.5rem; }
        .section-header h2 {
            font-size: 1.9rem; font-weight: 700; letter-spacing: 0.03em; margin-bottom: 0.4rem;
            background: linear-gradient(135deg, var(--accent3), var(--accent1));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .section-header p { color: #8888aa; font-size: 0.95rem; }

        /* 卡片网格 */
        .effects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.6rem; }
        .effect-card {
            background: linear-gradient(160deg, var(--surface), var(--surface2));
            border-radius: 22px; padding: 1.8rem 1.4rem; text-align: center;
            border: 1px solid var(--border);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        .effect-card::before {
            content: ''; position: absolute; inset: 0; border-radius: 22px; padding: 1px;
            background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .effect-card:hover { transform: translateY(-8px); box-shadow: 0 24px 50px rgba(0,0,0,0.55), 0 0 40px rgba(255,107,157,0.18); }
        .effect-card:hover::before { opacity: 1; }
        .effect-card .icon { font-size: 2.8rem; margin-bottom: 0.8rem; display: block; filter: drop-shadow(0 0 12px rgba(255,255,255,0.25)); }
        .effect-card h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.4rem; color: #f0f0ff; }
        .effect-card p { color: #9999bb; font-size: 0.88rem; line-height: 1.6; margin-bottom: 1.1rem; min-height: 2.8em; }
        .card-actions { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
        .btn-run, .btn-copy {
            border: 1px solid var(--border); border-radius: 24px; padding: 0.45rem 0.85rem; font-size: 0.81rem; font-weight: 600;
            cursor: pointer; transition: all 0.25s; display: inline-flex; align-items: center; gap: 0.25rem;
            text-decoration: none; white-space: nowrap;
        }
        .btn-run { background: rgba(78, 205, 196, 0.12); color: var(--accent2); }
        .btn-run:hover { background: rgba(78, 205, 196, 0.25); box-shadow: 0 0 18px rgba(78,205,196,0.35); }
        .btn-copy { background: rgba(255, 255, 255, 0.06); color: #d0d0e8; font-family: inherit; }
        .btn-copy:hover { background: rgba(255,255,255,0.14); color: #fff; }
        .btn-copy.done { background: rgba(78, 205, 196, 0.25); color: var(--accent2); border-color: var(--accent2); }
        /* 详解入口：低强调的次级链接，和两个主操作区分开 */
        .card-detail {
            display: inline-block; margin-top: 0.75rem; font-size: 0.8rem;
            color: #8e97c8; text-decoration: none; letter-spacing: 0.02em;
            border-bottom: 1px dashed rgba(142,151,200,0.35); padding-bottom: 1px; transition: all 0.25s;
        }
        .card-detail:hover { color: var(--accent5); border-bottom-color: var(--accent5); }

        /* 弹窗 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.82); backdrop-filter: blur(10px);
            align-items: center; justify-content: center; padding: 2rem 1rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--surface); border-radius: 24px; padding: 1.6rem; width: 92%; max-width: 760px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 70px rgba(0,0,0,0.6);
            position: relative; max-height: 90vh; overflow-y: auto;
        }
        .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .modal-head h3 { font-size: 1.5rem; background: linear-gradient(135deg, var(--accent2), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .close-modal { background: none; border: none; color: #fff; font-size: 1.6rem; cursor: pointer; opacity: 0.7; transition: opacity 0.3s; }
        .close-modal:hover { opacity: 1; }
        .demo-area {
            width: 100%; height: 360px; background: #05050c; border-radius: 16px; margin-bottom: 1rem;
            position: relative; overflow: hidden; border: 1px solid var(--border);
        }
        .modal-hint { text-align: center; color: #8888aa; font-size: 0.85rem; margin-bottom: 1rem; }
        .code-wrap { background: #05050c; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
        .code-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; background: rgba(255,255,255,0.04); border-bottom: 1px solid var(--border); }
        .code-bar span { font-size: 0.8rem; color: #8888aa; }
        .code-bar button {
            background: rgba(255,230,109,0.12); color: var(--accent3); border: 1px solid rgba(255,230,109,0.25);
            padding: 0.35rem 0.9rem; border-radius: 16px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-weight: 600;
        }
        .code-bar button:hover { background: rgba(255,230,109,0.25); }
        pre.code-block { margin: 0; padding: 1rem; max-height: 260px; overflow: auto; font-size: 0.8rem; line-height: 1.55; color: #c8c8e8; font-family: 'Consolas', 'Monaco', monospace; white-space: pre; }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(120px);
            background: rgba(20,20,40,0.95); color: #fff; padding: 0.9rem 1.8rem; border-radius: 30px;
            font-size: 0.95rem; z-index: 3000; border: 1px solid rgba(78,205,196,0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: transform 0.4s cubic-bezier(.2,1.2,.3,1); opacity: 0;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* 页脚 */
        .footer { position: relative; z-index: 1; text-align: center; padding: 3rem 2rem; border-top: 1px solid var(--border); color: #666688; font-size: 0.9rem; margin-top: 2rem; }
        .footer .domain { font-weight: 700; color: var(--accent2); font-size: 1.1rem; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
        .footer-links { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; margin: 1rem 0; }
        .footer-links a, .footer-links button { color: #8888aa; text-decoration: none; transition: color 0.3s; }
        .footer-links a:hover, .footer-links button:hover { color: var(--accent1); }
        .footer-links button { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }

        /* 全屏演示覆盖层 */
        .fs-overlay { position: fixed; inset: 0; z-index: 2500; background: #05050c; display: none; }
        .fs-overlay.active { display: block; }
        .fs-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 4vh 4vw; box-sizing: border-box; }
        .fs-frame { display: flex; justify-content: center; align-items: center; width: 800px; height: 600px; max-width: 95vw; max-height: 90vh; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 30px 80px rgba(0,0,0,0.6); background: #0b0b14; transition: width .3s ease, height .3s ease; }
        .fs-exit { position: fixed; top: 18px; right: 20px; z-index: 9999; display: flex; align-items: center; gap: .5rem; background: rgba(20,20,35,0.78); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: .55rem .95rem; border-radius: 999px; font-size: .95rem; font-family: inherit; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: auto; transition: all .2s; box-shadow: 0 4px 20px rgba(0,0,0,.4); }
        .fs-exit:hover { background: var(--accent1); border-color: var(--accent1); transform: scale(1.05); }
        .fs-exit .x { font-size: 1.3rem; line-height: 1; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero { padding: 7rem 1rem 3rem; }
            .section { padding: 2.5rem 1rem 1rem; }
            .effects-grid { grid-template-columns: 1fr; }
            .demo-area { height: 280px; }
            .search-box { min-width: 140px; }
        }
    </style>
</head>

        <button class="fs-exit" onclick="closeFullscreen()"><span class="x">✕</span> <span data-i18n="fs.exit">退出全屏</span></button>

    <script>
    /* ===================== 背景粒子 ===================== */
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgParticles = [], mouseX = -999, mouseY = -999, W, H;
    function resizeBg() { W = bgCanvas.width = innerWidth; H = bgCanvas.height = innerHeight; }
    addEventListener('resize', resizeBg); resizeBg();
    class BgP {
        constructor() { this.x = Math.random()*W; this.y = Math.random()*H; this.s = Math.random()*2+0.6; this.vx=(Math.random()-.5)*.5; this.vy=(Math.random()-.5)*.5; this.o = Math.random()*.5+.2; this.h = Math.random()*360; }
        update() {
            this.x+=this.vx; this.y+=this.vy;
            if(this.x<0||this.x>W) this.vx*=-1; if(this.y<0||this.y>H) this.vy*=-1;
            const dx=mouseX-this.x, dy=mouseY-this.y, d=Math.hypot(dx,dy);
            if(d<160){ this.x+=dx*0.003; this.y+=dy*0.003; }
        }
        draw() { bgCtx.beginPath(); bgCtx.arc(this.x,this.y,this.s,0,7); bgCtx.fillStyle='hsla('+this.h+',80%,75%,'+this.o+')'; bgCtx.fill(); }
    }
    for(let i=0;i<120;i++) bgParticles.push(new BgP());
    (function animBg(){ bgCtx.clearRect(0,0,W,H); bgParticles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animBg); })();
    addEventListener('mousemove', e=>{mouseX=e.clientX;mouseY=e.clientY;});
    addEventListener('mouseout', ()=>{mouseX=-999;mouseY=-999;});

    /* ===================== 工具函数 ===================== */
    function makeCanvas(el){ const c=document.createElement('canvas'); c.width=el.clientWidth; c.height=el.clientHeight; c.style.width='100%'; c.style.height='100%'; el.appendChild(c); return c; }
    function clearEl(el){ while(el.firstChild) el.removeChild(el.firstChild); }
    let toastTimer;
    function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }
    async function copyText(txt){ try{ await navigator.clipboard.writeText(txt); }catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } }

        code:"<canvas id='c'></canvas><script>\nconst c=document.getElementById('c'),x=c.getContext('2d');\nfunction boom(cx,cy){\n  for(let i=0;i<60;i++){const a=i/60*Math.PI*2,s=2+Math.random()*5;\n    let p={x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:Math.random()*360};\n    (function f(){p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.l-=0.015;\n      if(p.l>0){x.beginPath();x.arc(p.x,p.y,3,0,7);x.fillStyle='hsla('+p.h+',90%,60%,'+p.l+')';x.shadowBlur=12;x.shadowColor='hsla('+p.h+',90%,60%,1)';x.fill();requestAnimationFrame(f);}})();\n  }\n}\nc.addEventListener('click',e=>boom(e.offsetX,e.offsetY));\n<\/script>",
        demo(el){ const c=makeCanvas(el), x=c.getContext('2d'), W=c.width, H=c.height;

            (function f(){ p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.l-=0.015; if(p.l>0){ x.beginPath();x.arc(p.x,p.y,3,0,7);x.fillStyle='hsla('+p.h+',90%,60%,'+p.l+')';x.shadowBlur=14;x.shadowColor='hsla('+p.h+',90%,60%,1)';x.fill(); requestAnimationFrame(f);} })(); } }
          const stop=setInterval(()=>boom(Math.random()*W, Math.random()*H*0.7), 700);
          c.addEventListener('click', e=>boom(e.offsetX, e.offsetY));
          return ()=>clearInterval(stop);

      },
      {
        id:'confetti', icon:'🎊', title:'五彩纸屑', group:'particle',
        desc:'满屏彩色纸屑飘落，庆祝感拉满。',

      {

        code:"<canvas id='c'></canvas><script>\nconst c=document.getElementById('c'),x=c.getContext('2d');let pts=[];\nc.addEventListener('mousemove',e=>pts.push({x:e.offsetX,y:e.offsetY,l:1}));\n(function f(){x.clearRect(0,0,c.width,c.height);pts=pts.filter(p=>p.l>0);\n  pts.forEach(p=>{x.beginPath();x.arc(p.x,p.y,7,0,7);x.fillStyle='hsl('+(Date.now()/5%360)+',90%,65%)';x.shadowBlur=18;x.shadowColor=x.fillStyle;x.globalAlpha=p.l;x.fill();p.l-=0.02;});requestAnimationFrame(f);})();\n<\/script>",

            pts.forEach(p=>{ x.beginPath();x.arc(p.x,p.y,7,0,7); x.fillStyle='hsl('+(Date.now()/5%360)+',90%,65%)'; x.shadowBlur=18;x.shadowColor=x.fillStyle; x.globalAlpha=p.l; x.fill(); p.l-=0.02; }); requestAnimationFrame(f); })();

        demo(el){ const c=makeCanvas(el), x=c.getContext('2d'); let ps=Array.from({length:80},()=>({a:Math.random()*7,r:30+Math.random()*120,s:0.005+Math.random()*0.03,h:Math.random()*60+200}));

        code:"<script>\nfunction h(){const d=document.createElement('div');d.textContent='💖';\n  d.style.cssText='position:fixed;left:'+Math.random()*100+'vw;bottom:-30px;font-size:'+(14+Math.random()*20)+'px;';\n  document.body.appendChild(d);let y=0,r=0;\n  (function f(){y+=1.5;r+=3;d.style.transform='translateY('+-y+'px) rotate('+r+'deg)';if(y<innerHeight+40)requestAnimationFrame(f);else d.remove();})();}\nsetInterval(h,300);\n<\/script>",

    const EFFECTS = BASE_EFFECTS.concat(window.REPO_EFFECTS || []);

    /* ===================== 国际化（中 / EN） ===================== */
    const LANG_KEY = 'yilana.lang';
    let LANG = 'zh';

    // 翻译表的 key：原生用 id，仓库用 "repo:dir/file"（不受自增 id 影响）
    function fxKey(e){
      if(!e.repo) return e.id;
      return 'repo:' + (e.repo.dir ? e.repo.dir + '/' + e.repo.file : e.repo.file);
    }
    // 取当前语言下的标题 / 描述，缺译文时回落到中文原文
    function fxText(e){
      if(LANG === 'en'){
        const tr = (window.YI_FX_EN || {})[fxKey(e)];
        if(tr) return { title: tr[0], desc: tr[1] };
      }
      return { title: e.title, desc: e.desc };
    }
    // 取 UI 文案，支持 {n} 之类的占位替换
    function t(key, vars){
      const pack = window.YI_UI || {};
      const dict = pack[LANG] || pack.zh || {};
      let s = dict[key] != null ? dict[key] : ((pack.zh || {})[key] != null ? pack.zh[key] : key);
      if(vars) Object.keys(vars).forEach(k=>{ s = s.split('{'+k+'}').join(vars[k]); });
      return s;
    }
    function detectLang(){
      let q = null;
      try{ q = new URLSearchParams(location.search).get('lang'); }catch(e){}
      if(q === 'en' || q === 'zh') return q;
      try{
        const saved = localStorage.getItem(LANG_KEY);
        if(saved === 'en' || saved === 'zh') return saved;
      }catch(e){}
      return /^zh\b/i.test(navigator.language || '') ? 'zh' : 'en';
    }
    // 同步 hreflang / canonical 与实际地址，方便分享与搜索引擎收录
    function syncHeadLinks(){
      if(!/^https?:$/.test(location.protocol)) return; // file:// 下跳过，canonical / hreflang 无意义
      try{
        const u = new URL(location.href);
        if(LANG === 'en') u.searchParams.set('lang','en'); else u.searchParams.delete('lang');
        const clean = u.origin + u.pathname + (LANG === 'en' ? '?lang=en' : '');
        const can = document.querySelector('link[rel="canonical"]'); if(can) can.href = clean;
        const alt = document.querySelectorAll('link[rel="alternate"][hreflang]');
        alt.forEach(a=>{
          const h = a.getAttribute('hreflang');
          if(h === 'en') a.href = u.origin + u.pathname + '?lang=en';
          else a.href = u.origin + u.pathname;
        });
        history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
      }catch(e){}
    }
    function applyI18n(){
      document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
      const vars = { n: EFFECTS.length };
      document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n, vars); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPh); });
      const sw = document.getElementById('langSwitch');
      if(sw){ sw.textContent = t('lang.next'); sw.setAttribute('aria-label', t('lang.aria')); }
      const meta = (window.YI_META || {})[LANG] || {};

      if(meta.desc){

      if(fsBtn) fsBtn.textContent = t('modal.fullscreen');

    function setLang(lang){

      grid.innerHTML = '';

        const okGroup = currentFilter==='all' || e.group===currentFilter;

      const rel = dir ? dir+'/'+file : file;

      b.onclick=()=>{
        if(!currentEffectId) return;
        const id=currentEffectId;
        const cur=currentCleanup; if(cur){try{cur();}catch(e){}}
        clearEl(document.getElementById('modalDemoArea'));
        closeModal(); openFullscreen(id);
      };
      bar.appendChild(b);
    })();

    function randomEffect(){ const e=EFFECTS[Math.floor(Math.random()*EFFECTS.length)]; openEffect(e.id); }

    /* 初始化：先定语言，再渲染 */
    LANG = detectLang();
    applyI18n();
    renderCards();
    </script>
    <script src="consent.js" defer></script>
</body>
